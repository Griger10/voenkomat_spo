services:
  database:
    container_name: "voenkomat-postgres"
    restart: unless-stopped
    image: postgres:18-alpine
    env_file:
      - .env
    ports:
      - "15432:5432"
    volumes:
      - "./db_data:/var/lib/postgresql/"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
